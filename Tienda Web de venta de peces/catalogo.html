<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqualife</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <!-- Incluye el CSS de noUiSlider -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.css">
</head>
<body>

    <div class="wrapper">
        <header class="header-mobile">
            <h1 class="logo">Aqualife</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>
        
        <aside>
            <header class="logo"><a href="index.html">Aqualife</a></header>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            
            <section class="contenedor-filtros">
                <h2 class="filtrop">Filtros</h2>
                
                <!-- Filtro para Mascotas -->
                <div id="filtro-mascotas" class="filtro-categoria">
                    <h3 class="filtro-titulo" onclick="mostrarFiltro('mascotas')">Mascotas</h3>
                    <div class="filtro-desplegable">
                        <div class="filtro">
                            <label for="filtro-tipo">Tipo de Agua:</label>
                            <select id="filtro-tipo">
                                <option value="todos">Todos</option>
                                <option value="Agua dulce">Agua Dulce</option>
                                <option value="Agua salada">Agua Salada</option>
                            </select>
                        </div>
                        <div class="filtro">
                            <label for="filtro-tamaño">Tamaño:</label>
                            <select id="filtro-tamaño">
                                <option value="todos">Todos</option>
                                <option value="pequeño">Pequeño</option>
                                <option value="mediano">Mediano</option>
                                <option value="grande">Grande</option>
                            </select>
                        </div>
                        <div class="filtro">
                            <label for="filtro-compatibilidad">Compatibilidad:</label>
                            <select id="filtro-compatibilidad">
                                <option value="todos">Todos</option>
                                <option value="pacíficos">Pacíficos</option>
                                <option value="territoriales">Territoriales</option>
                            </select>
                        </div>
                        <div class="filtro">
                            <label for="filtro-experiencia">Dificultad:</label>
                            <select id="filtro-experiencia">
                                <option value="todos">Todos</option>
                                <option value="principiante">Principiante</option>
                                <option value="intermedio">Intermedio</option>
                                <option value="avanzado">Avanzado</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Filtro para Accesorios -->
                <div id="filtro-accesorios" class="filtro-categoria">
                    <h3 class="filtro-titulo" onclick="mostrarFiltro('accesorios')">Accesorios</h3>
                    <div class="filtro-desplegable">
                        <div class="filtro">
                            <label for="filtro-tipo-accesorio">Tipo:</label>
                            <select id="filtro-tipo-accesorio">
                                <option value="todos">Todos</option>
                                <option value="alimento">Comida</option>
                                <option value="decoracion">Decoración</option>
                                <option value="dispositivo">Filtros</option>
                            </select>
                        </div>
                        <div class="filtro">
                            <label for="filtro-tipo-tamaño">Tamaño:</label>
                            <select id="filtro-tipo-tamaño">
                                <option value="todos">Todos</option>
                                <option value="pequeño">Pequeño</option>
                                <option value="mediano">Mediano</option>
                                <option value="grande">Grande</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Filtro para Otros -->
                <div id="filtro-otros" class="filtro-categoria">
                    <h3 class="filtro-titulo" onclick="mostrarFiltro('otros')">Plantas</h3>
                    <div class="filtro-desplegable">
                        <div class="filtro">
                            <label for="filtro-experiencia-otros">Dificultad:</label>
                            <select id="filtro-experiencia-otros">
                                <option value="todos">Todos</option>
                                <option value="principiante">Principiante</option>
                                <option value="intermedio">Intermedio</option>
                                <option value="avanzado">Avanzado</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>
            <nav>
                <ul class="menu">
                    <li class="lista-busqueda">
                        <i class="bi bi-search icono-busqueda"></i>
                        <input type="text" id="busqueda" class="campo-busqueda" placeholder="Buscar productos...">
                    </li>
                    <li><button id="todos" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb-fill"></i> Todos los productos</button></li>
                    <li><button id="mascotas" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Peces</button></li>
                    <li><button id="accesorios" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Accesorios</button></li>
                    <li><button id="otros" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Plantas</button></li>
                    <li>
                        <a class="boton-menu boton-carrito" href="./carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito <span id="numerito" class="numerito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <footer>
                <p class="texto-footer">&copy; 2024 Tienda de Peces Aqualife. Todos los derechos reservados.</p>
            </footer>
        </aside>
        
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos"></div>
        </main>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/menu.js"></script>
</body>
</html>
